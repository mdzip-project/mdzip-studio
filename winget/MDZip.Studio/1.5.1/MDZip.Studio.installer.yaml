# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
PackageIdentifier: MDZip.Studio
PackageVersion: 1.5.1
InstallerType: nullsoft
Installers:
- Architecture: x64
  Scope: user                     # default: app only, no Explorer previewer
  InstallerUrl: https://github.com/mdzip-project/mdzip-studio/releases/download/v1.5.1/MDZip-Studio-Setup-1.5.1.exe
  InstallerSha256: <SHA256 of MDZip-Studio-Setup-1.5.1.exe>
  InstallerSwitches:
    Silent: /S /currentuser
    SilentWithProgress: /S /currentuser
- Architecture: x64
  Scope: machine                  # adds the Explorer preview handler (HKLM)
  InstallerUrl: https://github.com/mdzip-project/mdzip-studio/releases/download/v1.5.1/MDZip-Studio-Setup-1.5.1.exe
  InstallerSha256: <SHA256 of MDZip-Studio-Setup-1.5.1.exe>
  InstallerSwitches:
    Silent: /S /allusers /mdzipExplorerIntegration
    SilentWithProgress: /S /allusers /mdzipExplorerIntegration
  ElevationRequirement: elevatesSelf
  Dependencies:
    PackageDependencies:
    - PackageIdentifier: Microsoft.DotNet.DesktopRuntime.10
ManifestType: installer
ManifestVersion: 1.6.0
